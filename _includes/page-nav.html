{% comment %}
  "On this page" bar for long pages on phones and tablets (Oct 2026).
  Turn on per page with `page_nav: true` in front matter.
  Lists each h2 with an id, plus any h3 with a data-nav-label.
  Built with plain links, so it still works if the script fails.
{% endcomment %}
<nav class="pagenav" aria-label="On this page" hidden>
  <div class="pagenav__bar">
    <button type="button" class="pagenav__toggle" aria-expanded="false" aria-controls="pagenav-list">
      <span class="pagenav__kicker">On this page</span>
      <span class="pagenav__current" aria-live="polite"></span>
      <i class="fa-solid fa-chevron-down pagenav__chev" aria-hidden="true"></i>
    </button>
  </div>
  <div class="pagenav__progress" aria-hidden="true"><span></span></div>
  <ol class="pagenav__list" id="pagenav-list" hidden></ol>
</nav>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('.pagenav');
  var content = document.querySelector('.page__content');
  if (!nav || !content) return;

  var heads = [].slice.call(content.querySelectorAll('h2[id], h3[id][data-nav-label]'));
  if (heads.length < 2) return;

  var list = nav.querySelector('.pagenav__list');
  var toggle = nav.querySelector('.pagenav__toggle');
  var current = nav.querySelector('.pagenav__current');
  var bar = nav.querySelector('.pagenav__progress span');
  var links = [];

  function label(h) { return h.getAttribute('data-nav-label') || h.textContent.trim(); }

  heads.forEach(function (h) {
    var li = document.createElement('li');
    li.className = 'pagenav__item pagenav__item--' + h.tagName.toLowerCase();
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = label(h);
    li.appendChild(a);
    list.appendChild(li);
    links.push(a);
  });

  var top = document.createElement('li');
  top.className = 'pagenav__item pagenav__item--top';
  top.innerHTML = '<a href="#top"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i> Back to top</a>';
  list.insertBefore(top, list.firstChild);

  nav.hidden = false;

  function open(state) {
    toggle.setAttribute('aria-expanded', state ? 'true' : 'false');
    list.hidden = !state;
    nav.classList.toggle('is-open', state);
  }

  toggle.addEventListener('click', function () { open(list.hidden); });
  list.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a) return;
    open(false);
    if (a.getAttribute('href') === '#top') {
      e.preventDefault();
      window.scrollTo({ top: 0 });
      var first = document.querySelector('.logo__link');
      if (first) first.focus();
    } else {
      var target = document.getElementById(a.getAttribute('href').slice(1));
      if (target) { target.setAttribute('tabindex', '-1'); setTimeout(function () { target.focus({ preventScroll: true }); }, 0); }
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !list.hidden) { open(false); toggle.focus(); }
  });
  document.addEventListener('click', function (e) {
    if (!list.hidden && !nav.contains(e.target)) open(false);
  });

  function update() {
    var y = Math.max(90, window.innerHeight * 0.3); /* top third of the screen */
    var idx = -1;
    for (var i = 0; i < heads.length; i++) {
      if (heads[i].getBoundingClientRect().top - y <= 0) idx = i;
    }
    links.forEach(function (a, i) {
      if (i === idx) a.setAttribute('aria-current', 'location');
      else a.removeAttribute('aria-current');
    });
    var text = idx >= 0 ? label(heads[idx]) : 'Overview';
    if (current.textContent !== text) current.textContent = text;
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    bar.style.width = (max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0) + '%';
  }
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(function () { update(); ticking = false; }); }
  }, { passive: true });
  window.addEventListener('resize', update);
  update();
});
</script>
