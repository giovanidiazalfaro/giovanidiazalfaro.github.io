{% comment %} Resume and profile links in the header, top right (Oct 2026). {% endcomment %}
<ul class="header-social list-reset" aria-label="Resume and profiles">
  {% for social in site.data.settings.social %}
  <li class="header-social__item">
    <a class="header-social__link" href="{{ social.link }}" target="_blank" rel="noopener" aria-label="{{ social.name }} (opens in new tab)" title="{{ social.name }}"><i class="{{ social.icon }}" aria-hidden="true"></i></a>
  </li>
  {% endfor %}
  {% if site.data.settings.header_resume %}
  <li class="header-social__item header-social__item--resume">
    <a class="header-social__resume" href="{{ site.data.settings.header_resume.link }}" target="_blank" rel="noopener" title="Resume (PDF)">
      <i class="fa-solid fa-file-pdf" aria-hidden="true"></i><span>{{ site.data.settings.header_resume.label }}</span><span class="sr-only"> (opens in new tab)</span>
    </a>
  </li>
  {% endif %}
</ul>
