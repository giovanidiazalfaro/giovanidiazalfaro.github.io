<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% if site.data.settings.google-analytics %}
    {% include google-analytics.html %}
  {% endif %}

  <!-- begin global wrap -->
  <div class="global-wrap">

    {% include header.html %}

    <!-- begin content -->
    <main class="content" id="main-content" tabindex="-1" aria-label="Content">
      {{ content }}
    </main>
    <!-- end content -->

    <button type="button" class="top" aria-label="Back to top" title="Back to top"><i class="fa-solid fa-arrow-up-long" aria-hidden="true"></i></button>

    {% include footer.html %}
  </div>
  <!-- end global wrap -->

  <script src="{{ '/js/scripts.js' | relative_url }}"></script>
  <script src="{{ '/js/common.js' | relative_url }}"></script>
</body>

</html>
